name: FA Score Daily

on:
  schedule:
    # 10:10 UTC (17:10 ICT) — after TA Daily (09:23 UTC) has refreshed ta_ohlcv,
    # so the FA valuation (C14) uses today's close. Weekdays only.
    - cron: "10 10 * * 1-5"
  workflow_dispatch: # allow manual trigger from GitHub UI

# Serialize runs so a manual trigger never clobbers a scheduled one.
concurrency:
  group: fa-score-daily
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    environment: supabase
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Verify secrets are set
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "::error::SUPABASE_URL secret not set"; exit 1; fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then echo "::error::SUPABASE_ANON_KEY secret not set"; exit 1; fi
          echo "Secrets OK."

      # Daily mode = latest-quarter snapshot per symbol, refreshed with today's
      # close (C14). Reads fa_quarterly + fa_annual_pe + ta_ohlcv from the DB;
      # quarterly data is loaded separately via `refresh_fa.py import`.
      - name: Run FA daily score
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python refresh_fa.py score
