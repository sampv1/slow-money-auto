name: Sentiment Daily (Catalyst)

on:
  schedule:
    # 14:30 UTC (21:30 ICT), weekdays. Deliberately AFTER both TA Daily cron
    # windows (primary 09:23 UTC, backup 13:47 UTC) so fa_scores.final_grade —
    # which defines the A/A+ shortlist this job scores — is already refreshed.
    - cron: "30 14 * * 1-5"
  workflow_dispatch: # allow manual trigger from the GitHub UI

# Serialize runs so a manual trigger never overlaps the scheduled one. Both
# would draw on the same Groq quota, and the shared limit here is invisible
# (see below) — overlapping runs would starve each other.
concurrency:
  group: sentiment-daily
  cancel-in-progress: false

jobs:
  catalyst:
    runs-on: ubuntu-latest
    environment: supabase
    # Worst case is bounded by the retry budget: 4 shortlist symbols x 10
    # attempts x (~20s call + 45s spacing) is ~40 min. 75 leaves headroom for a
    # larger shortlist without letting a wedged run burn Actions minutes.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # CAN SLIM "N" catalyst scoring for the final-grade A/A+ shortlist, via
      # Groq `groq/compound` (built-in web search). Skipped cleanly when
      # GROQ_API_KEY is absent so the workflow never hard-fails.
      #
      # EXPECT PARTIAL COVERAGE — this runs on Groq's free tier, which cannot
      # reliably serve this workload. compound returns HTTP 413 on ~9 of 10
      # calls, and it is NOT a request-size problem: the failure lands 15-22s in
      # (after its search loop ran), the same prompt on a plain model answers in
      # 1.5s, and it fires while the visible budget still reads 69,000/70,000
      # tokens. A 429 named the real ceiling — `meta-llama/llama-4-scout`, the
      # sub-model compound drives its search loop with, which 404s if called
      # directly and so has a quota that is invisible and untunable from here.
      # refresh_catalysts.py retries with spacing; a symbol that never lands
      # keeps its previous score rather than being wiped. Coverage accumulates
      # across nightly runs. A paid Groq tier is what makes this deterministic.
      - name: Refresh catalyst scores (A/A+ shortlist)
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONUNBUFFERED: "1"  # stream Python stdout live to the Actions log
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY not set."
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY not set. After migration 045 anon is READ-ONLY, so writes in this run are silently discarded (PostgREST answers a denied write with 204/0 rows, not an error)."
          fi
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::notice::GROQ_API_KEY not set — skipping catalyst refresh."
            exit 0
          fi
          echo "▶ started $(date -u '+%H:%M:%S') UTC — live per-symbol progress + ETA below"
          # -u also forces unbuffered, belt-and-suspenders with PYTHONUNBUFFERED.
          python -u refresh_catalysts.py
          echo "■ finished $(date -u '+%H:%M:%S') UTC"

      # catalyst_score lands on ta_universe, which the Signal Pro page reads
      # through the `ta-data` cached bundle — without this the new score sits
      # invisible until the 1h TTL lapses. (The per-catalyst modal rows are
      # fetched client-side and need no invalidation.)
      # Non-fatal: if it fails, the cache TTL still refreshes within the hour.
      - name: Revalidate dashboard cache
        continue-on-error: true
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "::warning::REVALIDATE_SECRET not set — skipping cache revalidation."
            exit 0
          fi
          curl -fsSL -X POST -H "x-revalidate-secret: ${REVALIDATE_SECRET}" "https://www.loctinhieu.com/api/revalidate?tags=ta-data" \
            || echo "::warning::Dashboard revalidate call failed (cache will expire via TTL)."
