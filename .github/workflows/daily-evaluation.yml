name: Daily Price Evaluation

on:
  schedule:
    # 15:43 GMT+7 — 58 minutes after HOSE's ATC close at 14:45 GMT+7 (07:45 UTC).
    #
    # MUST run AFTER the close. `update_prices.py` checks TP/SL and books P&L
    # against "today's" bar, and its staleness guard (`_latest_today_bar`) only
    # compares the bar's DATE to today — a mid-session bar is dated today and
    # sails straight through. So running before 14:45 does not skip the symbol,
    # it evaluates an INTRADAY price as if it were the close, which can trigger
    # a stop that the closing price never hit.
    #
    # This was previously "12 6" = 13:12 GMT+7, i.e. during the afternoon
    # session, contradicting the comment that has always sat here.
    #
    # The margin is deliberate and must NOT be shaved on the assumption that
    # GitHub's queue delay (observed 50-75 min) will cover it — that delay is
    # never negative but it is not a guarantee, which is exactly the trap the
    # SOFR fix in macro-daily.yml had to undo. Uncommon minute mark (:43, not
    # :00/:30) to dodge the contested slots on the free tier. Mon-Fri only.
    - cron: "43 8 * * 1-5"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  evaluate:
    runs-on: ubuntu-latest
    environment: supabase
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Verify secrets are set
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL secret is not set in repo settings."
            echo "Go to Settings > Secrets and variables > Actions and add SUPABASE_URL."
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is not set in repo settings."
            echo "Go to Settings > Secrets and variables > Actions and add SUPABASE_ANON_KEY."
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY not set. After migration 045 anon is READ-ONLY, so writes in this run are silently discarded (PostgREST answers a denied write with 204/0 rows, not an error)."
          fi
          echo "Secrets OK: SUPABASE_URL length=${#SUPABASE_URL}, SUPABASE_ANON_KEY length=${#SUPABASE_ANON_KEY}"

      - name: Run price evaluation
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python update_prices.py

      # Expire the dashboard's server-side data cache so today's P&L / status
      # changes show immediately (see dashboard /api/revalidate).
      # Non-fatal: if it fails, the cache TTL still refreshes within the hour.
      - name: Revalidate dashboard cache
        continue-on-error: true
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "::warning::REVALIDATE_SECRET not set — skipping cache revalidation."
            exit 0
          fi
          curl -fsSL -X POST -H "x-revalidate-secret: ${REVALIDATE_SECRET}" "https://www.loctinhieu.com/api/revalidate?tags=rec-data" \
            || echo "::warning::Dashboard revalidate call failed (cache will expire via TTL)."
