name: Macro Daily

on:
  schedule:
    # 13:30 UTC (20:30 ICT) — weekdays only. Every VN source (SBV central rate,
    # VCB board, VN-Index close at 07:45 UTC, Vietstock OMO/VNIBOR) has settled
    # hours earlier, so the binding constraint is the US leg: the NY Fed posts
    # SOFR for day D at ~08:00 ET on D+1, i.e. 12:00 UTC in EDT and 13:00 UTC in
    # EST, and FRED serves it a moment later.
    #
    # The old 10:40 UTC (06:40 ET) was ALWAYS before that, year round — the job
    # only ever captured SOFR because GitHub's cron queue happened to delay the
    # start past 12:00. That is luck, not a schedule, and the two runs that
    # started early both lost the day: 2026-07-17 at 11:56 UTC (SOFR 07-16 not
    # stored until 07-20) and 2026-08-07 at 11:29 UTC (SOFR 08-06 missed; it was
    # on FRED ~29 min later). All 20 runs that started >= 12:05 UTC captured it.
    # Queue delay is always positive, so moving later is monotonically safer.
    - cron: "30 13 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill:
        description: "One-time history backfill (USD/VND: central via Vietstock 499 + VCB sell since 2022-10-17; CPI: CafeF 2025-09 -> now)"
        type: boolean
        default: false

# Serialize runs so a manual trigger never clobbers a scheduled one.
concurrency:
  group: macro-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: supabase
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Verify secrets are set
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "::error::SUPABASE_URL secret not set"; exit 1; fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then echo "::error::SUPABASE_ANON_KEY secret not set"; exit 1; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY not set. After migration 045 anon is READ-ONLY, so writes in this run are silently discarded (PostgREST answers a denied write with 204/0 rows, not an error)."
          fi
          echo "Secrets OK."

      # fx_central_rate (SBV portal, today) + fx_vcb_sell (VCB API, recent days) +
      # cpi_mom_index (Vietstock 395 through 2025-08 + data/macro/cpi_manual.csv overlay).
      # Manual runs can pass backfill=true to load full history in one shot.
      - name: Refresh macro (USD/VND + CPI)
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python refresh_macro.py --backfill
          else
            python refresh_macro.py
          fi

      # CPI (current months) from CafeF news — Vietstock's CPI feed froze at 2025-08
      # and GSO geo-gates cloud IPs, so this is how newer months stay current.
      # --upsert writes cpi_mom_index straight to macro_series (source='gso-cafef').
      # Non-fatal: a CafeF hiccup / a not-yet-published month must never fail the
      # FX pipeline, and unresolved months fall back to data/macro/cpi_manual.csv.
      - name: Fetch CPI (CafeF)
        continue-on-error: true
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python fetch_cpi.py --backfill --upsert
          else
            python fetch_cpi.py --upsert
          fi

      # Bank lending rate (system-wide average range) from SBV's monthly report.
      # SBV lists the last ~4 months; older months come from CafeF republications
      # (fallback) or data/macro/bank_lending_manual.csv. --upsert writes bank_lending_avg_*
      # to macro_series. Non-fatal: SBV's WAF / a not-yet-published month must never
      # fail the pipeline, and the CSV overlay (re-asserted by refresh_macro) persists.
      - name: Fetch bank lending rate (SBV)
        continue-on-error: true
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python fetch_bank_lending.py --from 2024-04 --upsert
          else
            python fetch_bank_lending.py --upsert
          fi

      # Total market margin debt (quarterly) from the CafeF "dư nợ margin toàn thị
      # trường" report — aggregated from securities-company quarterly financials.
      # --upsert writes margin_debt_total to macro_series; the ~2-quarter lookback
      # picks up each new quarter ~3 weeks after quarter-end. Non-fatal: a not-yet-
      # published quarter must never fail the pipeline, and older quarters persist
      # in data/macro/margin_debt_manual.csv (re-asserted by refresh_macro).
      - name: Fetch margin debt (quarterly)
        continue-on-error: true
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python fetch_margin_debt.py --upsert

      # Expire the dashboard's server-side data cache so the next page view
      # shows today's series immediately (see dashboard /api/revalidate).
      # Non-fatal: if it fails, the cache TTL still refreshes within the hour.
      - name: Revalidate dashboard cache
        continue-on-error: true
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "::warning::REVALIDATE_SECRET not set — skipping cache revalidation."
            exit 0
          fi
          curl -fsSL -X POST -H "x-revalidate-secret: ${REVALIDATE_SECRET}" "https://www.loctinhieu.com/api/revalidate?tags=macro-data" \
            || echo "::warning::Dashboard revalidate call failed (cache will expire via TTL)."
