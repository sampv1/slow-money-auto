name: Data Audit Daily

# THE WATCHDOG THAT WAS MISSING (2026-09-27).
#
# Every collector already gates its own writes through ta/run_status.py, and that
# architecture is sound — but it lives INSIDE the Python process. On 2026-09-25
# PyPI quarantined the `vnstock` package, all seven daily workflows died at
# `pip install` in 10-20 seconds, and so not one require() ever executed. Nothing
# was collected, nothing was checked, and nothing said so: the only signal was
# seven red X's in the Actions tab, which is a place nobody looks on a Friday
# evening. The gap was found two days later by opening the website.
#
# A collector cannot be its own monitor, because the ways it fails include not
# running. This job is deliberately SEPARATE: it reads the database and compares
# it against the market, so it reports a hole whatever the cause — a quarantined
# dependency, a revoked secret, a disabled schedule, a provider outage, or a bug.
#
# It is also why audit_data.py gained `layer_calendar`: its trading calendar was
# derived from ta_ohlcv itself, so a session with zero bars was not in the
# calendar and could not be reported missing. The audit ran green, exit 0, with a
# whole session absent. The witness has to be outside the pipeline.

on:
  schedule:
    # 15:00 UTC (22:00 ICT). AFTER every collector: ta-daily 09:23 (+13:47
    # backup), fa-import 08:00, fa-score 10:10, macro-daily 13:30, and
    # fa-securities, which macro-daily triggers and which has a 14:05 backstop.
    # Auditing before the last writer finishes would report its lag as a fault,
    # which is how a monitor teaches people to ignore it.
    #
    # Runs EVERY day, not Mon-Fri. A weekend run is the cheap case — the market
    # traded no new session, so layer_calendar confirms the newest one is stored
    # and the job is quiet. Restricting it to weekdays would have left exactly
    # this incident undetected until Monday, since Friday's collection failed
    # after Friday's audit would already have run.
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: data-audit-daily
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: supabase
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      # THE WATCHDOG MUST SURVIVE THE OUTAGE IT DETECTS. Installing the same
      # requirements.txt as the collectors meant the PyPI quarantine of
      # vnstock/vnai would kill this job at `pip install` as well — which is how
      # 2026-09-25 went unreported for two days. So the full install is
      # attempted, and a failure falls back to the two packages audit_data.py
      # actually needs rather than ending the run.
      - name: Install dependencies
        id: deps
        run: |
          if pip install -r scripts/requirements.txt; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Full install failed — falling back to the audit-only dependency set (scripts/requirements-audit.txt). The data audit still runs, but WITHOUT the external calendar witness, so a missing session can only WARN, not FAIL. See vendor/wheels/README.md."
            pip install -r scripts/requirements-audit.txt
            echo "mode=degraded" >> "$GITHUB_OUTPUT"
          fi

      # A BROKEN TOOLCHAIN AND MISSING DATA ARE DIFFERENT INCIDENTS, and from
      # outside the job they look identical: one red X. They call for different
      # actions — repair the install versus recover a session — so this records
      # which, WITHOUT failing yet: the audit still has to run and report. The
      # job is failed at the end instead, so both verdicts get through.
      - name: Report the toolchain state
        id: toolchain
        run: |
          cd scripts
          python - <<'PY'
          import os
          try:
              import vnstock, vnai   # noqa: F401
              from importlib.metadata import version
              msg = f"vnstock {version('vnstock')} · vnai {version('vnai')}"
              ok = True
          except Exception as exc:
              msg = f"{type(exc).__name__}: {exc}"
              ok = False
              print("::error::Toolchain degraded, which is NOT a data problem: "
                    f"{msg}. vnstock and vnai are QUARANTINED on PyPI (zero files "
                    "on the index), so nothing can install them from there. The "
                    "audit below still ran; its calendar check could not.")
          print(msg)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"ok={'true' if ok else 'false'}\n")
              fh.write(f"detail={msg}\n")
          PY

      - name: Verify secrets are set
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "::error::SUPABASE_URL secret not set"; exit 1; fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then echo "::error::SUPABASE_ANON_KEY secret not set"; exit 1; fi
          echo "Secrets OK."

      # `continue-on-error` so a critical data gap does not stop the summary from
      # being written; the final step is what fails the job.
      - name: Audit the data chain
        id: audit
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd scripts
          set -o pipefail
          # Tee so the summary can quote the failures even though the script's
          # own exit code is what fails the job.
          python audit_data.py 2>&1 | tee "$RUNNER_TEMP/audit.txt"

      # Always, so a failing audit still explains itself in the run summary
      # rather than only in a log someone has to open and scroll.
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Data chain audit"
            echo
            if [ "${{ steps.audit.outcome }}" = "success" ]; then
              echo "No critical gap."
            else
              echo "### Critical gaps"
              echo '```'
              grep -E "FAIL" "$RUNNER_TEMP/audit.txt" || echo "(audit did not run)"
              echo '```'
              echo "Recovery runbook: \`.claude/skills/data-audit/SKILL.md\`"
            fi
            echo
            echo "<details><summary>Full audit</summary>"
            echo
            echo '```'
            cat "$RUNNER_TEMP/audit.txt" 2>/dev/null || echo "(no output)"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # BOTH verdicts fail the job, and the summary above already distinguishes
      # them. Failing earlier would have hidden whichever one came second.
      - name: Fail on a data gap or a degraded toolchain
        if: always()
        run: |
          rc=0
          if [ "${{ steps.audit.outcome }}" != "success" ]; then
            echo "::error::The data chain audit reported a critical gap — see the job summary."
            rc=1
          fi
          if [ "${{ steps.toolchain.outputs.ok }}" != "true" ]; then
            echo "::error::Dependencies could not be installed in full (${{ steps.deps.outputs.mode }} mode). The pipeline cannot run in CI until vendor/wheels is supplied."
            rc=1
          fi
          exit $rc
