name: TA Daily Update

on:
  schedule:
    # VN market closes at 15:00 GMT+7 (08:00 UTC). We run at 09:23 UTC
    # (16:23 ICT) to give vnstock ~80 min to publish today's closing bar.
    # Weekdays only. Avoiding round-minute marks (:00/:15/:30/:45) reduces
    # GitHub Actions free-tier cron queue contention, which can cause fast
    # SIGTERM kills during pip install.
    - cron: "23 9 * * 1-5"
  workflow_dispatch: # allow manual trigger from GitHub UI

# Serialize scheduled and manual runs so they never clobber each other —
# the second one queues instead of being cancelled, eliminating one common
# source of mid-pip-install SIGTERM (exit 143).
concurrency:
  group: ta-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment: supabase
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache the pip download/wheel directory keyed on requirements.txt.
          # Turns a 60-90s cold install (vnstock pulls matplotlib + pandas +
          # numpy + mplfinance) into a ~5s cache hit, drastically shrinking
          # the window where external flakes can kill the job.
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Verify secrets are set
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL secret is not set in repo settings."
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is not set in repo settings."
            exit 1
          fi
          echo "Secrets OK."

      - name: Run TA daily update
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python update_ta_daily.py
