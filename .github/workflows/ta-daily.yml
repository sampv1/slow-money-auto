name: TA Daily Update

on:
  schedule:
    # Primary: 09:23 UTC (16:23 ICT) — VN market closes at 15:00 GMT+7
    # (08:00 UTC), so ~80 min after close gives vnstock time to publish
    # today's closing bar. Weekdays only. Off-minute mark avoids GitHub
    # Actions free-tier cron queue contention.
    - cron: "23 9 * * 1-5"
    # Backup: 13:47 UTC (20:47 ICT) — GitHub free-tier silently drops
    # ~one scheduled run every few weeks under platform load. This second
    # trigger catches those misses. The `precheck` job below queries
    # today's run history and short-circuits the backup if today's primary
    # already succeeded, so on a normal day the backup is a cheap no-op.
    - cron: "47 13 * * 1-5"
  workflow_dispatch: # allow manual trigger from GitHub UI

# Serialize scheduled and manual runs so they never clobber each other —
# the second one queues instead of being cancelled, eliminating one common
# source of mid-pip-install SIGTERM (exit 143).
concurrency:
  group: ta-daily
  cancel-in-progress: false

jobs:
  # Lightweight gate that runs on every trigger. For the backup cron, it
  # queries today's run history and skips the heavy `update` job if today's
  # primary run already succeeded. For the primary cron and manual
  # workflow_dispatch, it always green-lights the update job.
  precheck:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Decide whether to run update
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          IS_BACKUP_CRON: ${{ github.event.schedule == '47 13 * * 1-5' }}
        run: |
          # Primary cron + manual dispatch always run.
          if [ "$IS_BACKUP_CRON" != "true" ]; then
            echo "Trigger is ${{ github.event_name }} (schedule='${{ github.event.schedule }}') — proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Backup cron: skip if any earlier run of THIS workflow already
          # succeeded today (UTC). Excludes the current run from the count.
          since=$(date -u +%Y-%m-%dT00:00:00Z)
          earlier_successes=$(gh run list \
            --workflow=ta-daily.yml \
            --status=success \
            --created=">=${since}" \
            --limit=20 \
            --json databaseId \
            -R "${{ github.repository }}" \
            | jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length")
          if [ "$earlier_successes" -gt 0 ]; then
            echo "::notice::Backup cron firing but ${earlier_successes} successful run(s) already exist today — skipping update."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Backup cron firing and no successful run yet today — proceeding with update."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment: supabase
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache the pip download/wheel directory keyed on requirements.txt.
          # Turns a 60-90s cold install (vnstock pulls matplotlib + pandas +
          # numpy + mplfinance) into a ~5s cache hit, drastically shrinking
          # the window where external flakes can kill the job.
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Verify secrets are set
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL secret is not set in repo settings."
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is not set in repo settings."
            exit 1
          fi
          echo "Secrets OK."

      - name: Run TA daily update
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python update_ta_daily.py

      # Auxiliary: VN30 futures implied risk (IR) for the Implied Risk chart.
      # Two vnstock fetches; non-fatal so an IR hiccup never fails the TA run.
      - name: Refresh implied risk (IR)
        working-directory: scripts
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python refresh_implied_risk.py

      # Expire the dashboard's server-side data cache so the next page view
      # shows today's data immediately (see dashboard /api/revalidate).
      # Non-fatal: if it fails, the cache TTL still refreshes within the hour.
      - name: Revalidate dashboard cache
        continue-on-error: true
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "::warning::REVALIDATE_SECRET not set — skipping cache revalidation."
            exit 0
          fi
          curl -fsSL -X POST "https://www.loctinhieu.com/api/revalidate?secret=${REVALIDATE_SECRET}&tags=ta-data" \
            || echo "::warning::Dashboard revalidate call failed (cache will expire via TTL)."
