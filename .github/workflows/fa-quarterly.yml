name: FA Quarterly Refresh

on:
  schedule:
    # 04:00 UTC (11:00 ICT) on the 1st of Feb / May / Aug / Nov — shortly after
    # the Vietnamese quarterly earnings filing deadlines. A missed run is
    # recoverable via the manual trigger below, so (unlike ta-daily) we don't
    # bother with a backup cron + precheck.
    - cron: "0 4 1 2,5,8,11 *"
  workflow_dispatch: # allow manual trigger from the GitHub UI

# Serialize scheduled + manual runs so they never clobber each other.
concurrency:
  group: fa-quarterly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: supabase
    # Full universe (~1500 symbols) at ~3 vnstock calls x 4s ≈ 5h. 6h hard cap.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Verify secrets are set
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL secret is not set in repo settings."
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is not set in repo settings."
            exit 1
          fi
          echo "Secrets OK."

      - name: Run FA quarterly refresh
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python refresh_fa.py
